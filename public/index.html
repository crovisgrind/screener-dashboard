<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBOV · Asset Management</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Press+Start+2P&family=Bangers&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080a0f; --surface:#0f1218; --surf2:#151b24; --border:#1e2738;
  --text:#dce6f5; --muted:#4a5568; --dim:#2a3548;
  --green:#00f0a0; --yellow:#f5c842; --red:#ff3d5a; --blue:#4d9eff; --purple:#a78bfa;
  --mono:'Space Mono',monospace; --pixel:'Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:52px;background:rgba(8,10,15,.97);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  backdrop-filter:blur(12px);
}
#topbar .logo{font-family:var(--pixel);font-size:9px;color:var(--green);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.logo-led{width:6px;height:6px;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#topbar .right{display:flex;align-items:center;gap:12px}
.update-info{text-align:right;font-size:9px;color:var(--muted)}
.update-info span{color:var(--text);font-size:10px}
.btn-refresh{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:5px 12px;border-radius:4px;font-family:var(--pixel);font-size:7px;cursor:pointer;
  transition:.2s;letter-spacing:.5px}
.btn-refresh:hover{border-color:var(--green);color:var(--green)}

/* ── NAV ROOMS ── */
#nav-rooms{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:54px;background:rgba(8,10,15,.97);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:0;
}
.room-btn{
  font-family:var(--pixel);font-size:7px;padding:0 28px;height:100%;border:none;
  background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  transition:.2s;letter-spacing:.5px;position:relative;top:1px;
  display:flex;align-items:center;gap:8px;
}
.room-btn:hover{color:var(--text)}
.room-btn.active{color:var(--text);border-bottom-color:var(--green)}
.room-btn.active.room-apgar{border-bottom-color:var(--purple)}
.room-btn.active.room-tracker{border-bottom-color:var(--yellow)}
.room-dot{width:8px;height:8px;border-radius:2px;background:var(--muted);transition:.2s}
.room-btn.active .room-dot{background:var(--green)}
.room-btn.active.room-apgar .room-dot{background:var(--purple)}
.room-btn.active.room-tracker .room-dot{background:var(--yellow)}

/* ── ISO STAGE ── */
#stage{
  position:fixed;top:52px;left:0;right:0;bottom:54px;
  overflow:hidden;
}
#iso-world{
  width:100%;height:100%;
  cursor:grab;
  transition:transform .7s cubic-bezier(0.22,1,0.36,1);
}
#iso-world:active{cursor:grabbing}

/* ── SVG ISO ── */
#iso-svg{display:block;width:100%;height:100%}

/* ── OVERLAY PANEL ── */
#data-panel{
  position:fixed;right:0;top:52px;bottom:54px;
  width:360px;z-index:150;
  background:rgba(8,10,15,.95);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(0.22,1,0.36,1);
  backdrop-filter:blur(12px);
}
#data-panel.open{transform:translateX(0)}
#panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#panel-title{font-family:var(--pixel);font-size:9px;letter-spacing:1px}
#panel-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;line-height:1}
#panel-close:hover{color:var(--text)}
#panel-body{flex:1;overflow-y:auto;padding:16px 20px}
#panel-body::-webkit-scrollbar{width:4px}
#panel-body::-webkit-scrollbar-track{background:transparent}
#panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── PANEL CONTENT STYLES ── */
.p-section{margin-bottom:20px}
.p-section-title{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.p-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.p-stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.p-stat-label{font-size:7px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.p-stat-value{font-size:18px;font-weight:700;line-height:1}
.p-stat-value.g{color:var(--green)}.p-stat-value.y{color:var(--yellow)}.p-stat-value.r{color:var(--red)}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(30,39,56,.4)}
.p-row:last-child{border-bottom:none}
.p-ticker{font-size:11px;font-weight:700}
.p-val{font-size:10px}.p-val.g{color:var(--green)}.p-val.r{color:var(--red)}.p-val.y{color:var(--yellow)}
.p-pill{font-size:8px;padding:2px 7px;border-radius:3px;font-weight:700}
.p-pill.buy{background:rgba(0,240,160,.12);color:var(--green);border:1px solid rgba(0,240,160,.25)}
.p-pill.sell{background:rgba(255,61,90,.1);color:var(--red);border:1px solid rgba(255,61,90,.2)}
.p-score-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(30,39,56,.4)}
.p-score-badge{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.score-forte{background:rgba(0,240,160,.1);color:var(--green);border:1px solid rgba(0,240,160,.25)}
.score-pos{background:rgba(245,200,66,.1);color:var(--yellow);border:1px solid rgba(245,200,66,.2)}
.score-neu{background:rgba(220,230,245,.05);color:var(--text);border:1px solid var(--border)}
.score-frac{background:rgba(255,61,90,.07);color:var(--red);border:1px solid rgba(255,61,90,.15)}
.p-dots{display:flex;gap:3px}
.p-dot{width:7px;height:7px;border-radius:2px}
.pd2{background:var(--green)}.pd1{background:var(--yellow)}.pd0{background:var(--dim)}
.p-trk-row{display:grid;grid-template-columns:70px 1fr 60px 56px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,39,56,.4)}
.p-trk-pill{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;text-align:center}
.pill-open{background:rgba(0,240,160,.1);color:var(--green)}
.pill-tp{background:rgba(77,158,255,.1);color:var(--blue)}
.pill-ts{background:rgba(90,100,120,.1);color:var(--muted)}
.p-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.p-f-btn{font-size:7px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:.2s;font-family:var(--mono)}
.p-f-btn:hover,.p-f-btn.active{border-color:var(--text);color:var(--text);background:var(--surf2)}
.p-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:10px;color:var(--text);outline:none;margin-bottom:12px}
.p-search:focus{border-color:var(--blue)}
.btn-add{background:rgba(0,240,160,.08);border:1px solid rgba(0,240,160,.2);color:var(--green);
  padding:6px 12px;border-radius:4px;font-family:var(--pixel);font-size:7px;cursor:pointer;width:100%;margin-bottom:8px}
.p-empty{color:var(--muted);font-size:9px;text-align:center;padding:24px 0}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:320px}
.modal-title{font-family:var(--pixel);font-size:8px;letter-spacing:1px;margin-bottom:16px;color:var(--green)}
.f-label{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.f-input{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:10px;color:var(--text);outline:none;margin-bottom:10px}
.f-input:focus{border-color:var(--green)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.btn-ok{flex:1;background:var(--green);color:#080a0f;border:none;padding:9px;border-radius:6px;font-family:var(--pixel);font-size:7px;cursor:pointer}
.btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:6px;font-family:var(--pixel);font-size:7px;cursor:pointer}

/* ── ISO TILES CSS (glow effects) ── */
.monitor-glow{filter:drop-shadow(0 0 6px rgba(0,240,160,.5))}
.monitor-glow-y{filter:drop-shadow(0 0 6px rgba(245,200,66,.4))}
.monitor-glow-p{filter:drop-shadow(0 0 6px rgba(167,139,250,.5))}
.lamp-flicker{animation:lamp 3s ease-in-out infinite}
@keyframes lamp{0%,95%,100%{opacity:.9}96%{opacity:.5}97%{opacity:.9}98%{opacity:.6}99%{opacity:.9}}

/* ── SPRITES ── */
.sprite-wrap{position:absolute;pointer-events:none}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;z-index:250;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:8px 12px;font-size:9px;color:var(--text);
  pointer-events:none;display:none;max-width:180px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}

/* ── SOUND TOGGLE ── */
#snd-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:5px 10px;border-radius:4px;font-size:9px;cursor:pointer;transition:.2s}
#snd-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ── LOADING ── */
#loading-screen{
  position:fixed;inset:0;z-index:500;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s;
}
#loading-screen.hide{opacity:0;pointer-events:none}
#loading-title{font-family:var(--pixel);font-size:10px;color:var(--green);letter-spacing:2px}
#loading-bar-bg{width:200px;height:4px;background:var(--border);border-radius:2px}
#loading-bar-fill{height:100%;border-radius:2px;background:var(--green);width:0;transition:width .3s}
#loading-msg{font-size:8px;color:var(--muted);letter-spacing:1px}

/* ── SPRITE ANIMATIONS ── */
#apgar-sprite-overlay{display:none;position:fixed;inset:0;z-index:400;pointer-events:none;background:transparent;visibility:hidden}
#apgar-sprite-overlay[style*="block"]{visibility:visible}
#apgar-sprite-canvas{position:absolute;inset:0;width:100%;height:100%}
#apgar-sprite-overlay.slide-left-out{animation:slideLeftOut .55s cubic-bezier(.55,0,1,.45) forwards}
@keyframes slideLeftOut{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-110vw);opacity:0}}

#fugazi-container{
  position:fixed;top:52px;left:-110vw;width:100vw;z-index:390;
  pointer-events:none;visibility:hidden;
  display:flex;flex-direction:column;align-items:center;
  transition:left .45s cubic-bezier(.22,1,.36,1);
}
#fugazi-container.slide-in{left:0;visibility:visible}
#fugazi-container.slide-out{left:110vw;visibility:visible;transition:left .4s cubic-bezier(.55,0,1,.45)}
#fugazi-balloon{
  position:relative;background:#fff;border:4px solid #111;border-radius:28px;
  padding:12px 22px;margin:10px 20px 0;max-width:min(88vw,520px);
  box-shadow:5px 5px 0 #111;
}
#fugazi-balloon::after{content:'';position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
  border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid #111}
#fugazi-balloon::before{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #fff;z-index:1}
#fugazi-text{font-family:'Bangers','Impact',cursive;font-size:clamp(22px,5vw,38px);color:#111;
  letter-spacing:2px;text-align:center;text-shadow:2px 2px 0 #ddd;white-space:nowrap}
#fugazi-canvas{display:block;width:100vw}

#walk-sprite{position:fixed;bottom:70px;left:-160px;width:140px;height:140px;z-index:395;
  pointer-events:none;visibility:hidden;
  image-rendering:pixelated;background-image:url('sprite_walk.png');background-repeat:no-repeat}

@media(max-width:600px){
  #data-panel{width:100%;border-left:none;border-top:1px solid var(--border)}
  .room-btn{padding:0 16px;font-size:6px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">
    <span class="logo-led" style="background:var(--green)"></span>
    <span class="logo-led" style="background:var(--yellow);animation-delay:.4s"></span>
    <span class="logo-led" style="background:var(--red);animation-delay:.8s"></span>
    IBOV·ASSET·MGMT
  </div>
  <div class="right">
    <div class="update-info">
      <div style="font-size:8px;letter-spacing:1px">ÚLTIMA ATUALIZAÇÃO</div>
      <span id="updateTime">—</span>
    </div>
    <button id="snd-btn" onclick="toggleSound()">♪ SOM</button>
    <button class="btn-refresh" onclick="forceUpdate(event)">↻ UPDATE</button>
  </div>
</div>

<!-- ISO STAGE -->
<div id="stage">
  <div id="iso-world">
    <svg id="iso-svg" viewBox="0 0 2400 900" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Pixel font via SVG filter for crisp rendering -->
        <filter id="pixel" color-interpolation-filters="sRGB">
          <feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
        </filter>
        <!-- Monitor screen glow -->
        <filter id="glow-g" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-y" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- Lamp light -->
        <radialGradient id="lamp1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00f0a0" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#00f0a0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lamp2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lamp3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5c842" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ═══════════════════════════════════════════════ -->
      <!-- SALA 1 — TRADING FLOOR (MRS·RSV) x=0           -->
      <!-- ═══════════════════════════════════════════════ -->
      <g id="room-mrs" transform="translate(0,0)">
        <!-- Luz ambiente -->
        <ellipse cx="400" cy="300" rx="380" ry="260" fill="url(#lamp1)" class="lamp-flicker"/>

        <!-- Piso isométrico 8x6 tiles -->
        <!-- Tile base: parallelogram iso -->
        <!-- Row 0 -->
        <polygon points="100,500 300,400 500,500 300,600" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <polygon points="300,400 500,300 700,400 500,500" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>
        <polygon points="500,300 700,200 900,300 700,400" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <polygon points="700,200 900,100 1100,200 900,300" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>
        <!-- Row 1 -->
        <polygon points="100,600 300,500 500,600 300,700" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>
        <polygon points="300,500 500,400 700,500 500,600" fill="#0c1c12" stroke="#0d2015" stroke-width="1"/>
        <polygon points="500,400 700,300 900,400 700,500" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>
        <polygon points="700,300 900,200 1100,300 900,400" fill="#0c1c12" stroke="#0d2015" stroke-width="1"/>
        <!-- Row 2 -->
        <polygon points="100,700 300,600 500,700 300,800" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <polygon points="300,600 500,500 700,600 500,700" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>
        <polygon points="500,500 700,400 900,500 700,600" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <polygon points="700,400 900,300 1100,400 900,500" fill="#0b1a11" stroke="#0d2015" stroke-width="1"/>

        <!-- Parede esquerda (norte) -->
        <polygon points="100,500 900,100 900,0 100,400" fill="#060e08" stroke="#0d2015" stroke-width="1"/>
        <!-- Parede direita (leste) -->
        <polygon points="900,100 1100,200 1100,400 900,300" fill="#050d07" stroke="#0d2015" stroke-width="1"/>
        <!-- Teto parcial -->
        <polygon points="100,400 900,0 1100,100 300,500" fill="#080f09" stroke="#0d2015" stroke-width="0.5" opacity="0.6"/>

        <!-- LUMINÁRIA 1 -->
        <g class="lamp-flicker">
          <line x1="500" y1="0" x2="500" y2="80" stroke="#1e3828" stroke-width="2"/>
          <rect x="460" y="80" width="80" height="12" rx="3" fill="#1a3020" stroke="#00f0a040" stroke-width="1"/>
          <rect x="462" y="82" width="76" height="8" rx="2" fill="#00f0a0" opacity="0.7" filter="url(#glow-g)"/>
        </g>

        <!-- MESA TRADING 1 (esquerda) -->
        <!-- Tampa da mesa -->
        <polygon points="160,460 360,360 460,410 260,510" fill="#0f2218" stroke="#1e3828" stroke-width="1.5"/>
        <!-- Lateral esquerda -->
        <polygon points="160,460 260,510 260,560 160,510" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <!-- Lateral direita -->
        <polygon points="460,410 260,510 260,560 460,460" fill="#09160e" stroke="#0d2015" stroke-width="1"/>

        <!-- Monitor 1A -->
        <g filter="url(#glow-g)" id="mon-mrs-1">
          <!-- Base monitor -->
          <polygon points="190,430 290,380 330,400 230,450" fill="#0a1a10" stroke="#00f0a060" stroke-width="1.5"/>
          <!-- Tela -->
          <polygon points="195,427 290,378 325,396 230,445" fill="#001a0e"/>
          <!-- Gráfico MRS animado -->
          <polyline id="mrs-chart-1" points="200,440 218,430 230,435 248,420 265,425 280,415" fill="none" stroke="#00f0a0" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Label -->
          <text x="255" y="413" fill="#00f0a0" font-family="Space Mono" font-size="6" font-weight="700">MRS</text>
        </g>

        <!-- Monitor 1B -->
        <g filter="url(#glow-g)" id="mon-mrs-2">
          <polygon points="250,400 350,350 390,370 290,420" fill="#0a1a10" stroke="#00f0a060" stroke-width="1.5"/>
          <polygon points="255,397 350,348 385,366 290,415" fill="#001a0e"/>
          <polyline id="mrs-chart-2" points="260,410 275,402 288,406 302,396 318,400 330,390" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
          <text x="315" y="384" fill="#f5c842" font-family="Space Mono" font-size="6" font-weight="700">RSV</text>
        </g>

        <!-- Cadeira -->
        <polygon points="230,530 310,490 350,510 270,550" fill="#0d1f15" stroke="#1e3828" stroke-width="1"/>
        <polygon points="230,530 270,550 270,580 230,560" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>

        <!-- MESA TRADING 2 (direita) -->
        <polygon points="540,390 740,290 840,340 640,440" fill="#0f2218" stroke="#1e3828" stroke-width="1.5"/>
        <polygon points="540,390 640,440 640,490 540,440" fill="#0a1810" stroke="#0d2015" stroke-width="1"/>
        <polygon points="840,340 640,440 640,490 840,390" fill="#09160e" stroke="#0d2015" stroke-width="1"/>

        <!-- Monitor 2A -->
        <g filter="url(#glow-g)" id="mon-mrs-3">
          <polygon points="570,360 670,310 710,330 610,380" fill="#0a1a10" stroke="#00f0a060" stroke-width="1.5"/>
          <polygon points="575,357 670,308 705,326 610,375" fill="#001a0e"/>
          <polyline id="mrs-chart-3" points="580,368 595,360 608,364 622,354 638,358 650,348" fill="none" stroke="#00f0a0" stroke-width="1.5" stroke-linecap="round"/>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let _dados = null;
let _filtro = 'todos';
let _search = '';
let _currentRoom = 'mrs';
let _soundOn = false;
let _audioCtx = null;
const LS_KEY = 'ibov_tracker_v1';
const TP_PCT = 0.05;

// ═══════════════════════════════════════════════════════
// LOADING
// ═══════════════════════════════════════════════════════
function loadingProgress(pct, msg) {
  document.getElementById('loading-bar-fill').style.width = pct + '%';
  if (msg) document.getElementById('loading-msg').textContent = msg;
}
function hideLoading() {
  const el = document.getElementById('loading-screen');
  el.classList.add('hide');
  setTimeout(() => el.style.display = 'none', 600);
}

// ═══════════════════════════════════════════════════════
// CAMERA / ROOM NAVIGATION
// ═══════════════════════════════════════════════════════
const ROOM_X = { mrs: 0, apgar: -800, tracker: -1600 };

function goRoom(id, btn) {
  if (_currentRoom === id) { togglePanel(); return; }
  _currentRoom = id;

  // Update nav
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  // Slide camera
  const svg = document.getElementById('iso-svg');
  const stage = document.getElementById('stage');
  const W = stage.offsetWidth;
  const H = stage.offsetHeight;
  const scaleX = W / 2400;
  const scaleY = H / 900;
  const scale  = Math.max(scaleX, scaleY);
  const tx = ROOM_X[id] * scale + (W - 800 * scale) / 2;
  const ty = (H - 900 * scale) / 2;
  document.getElementById('iso-world').style.transform =
    'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';

  // Sprites & sounds
  if (id === 'mrs') {
    triggerFugazi();
    playSound('swoosh');
  } else if (id === 'apgar') {
    triggerApgarSprite();
    playSound('chime');
  } else if (id === 'tracker') {
    triggerWalkSprite();
    playSound('tick');
  }

  // Update panel if open
  if (document.getElementById('data-panel').classList.contains('open')) {
    openPanel(id);
  }
}

function initCamera() {
  const stage = document.getElementById('stage');
  const W = stage.offsetWidth;
  const H = stage.offsetHeight;
  const scaleX = W / 2400;
  const scaleY = H / 900;
  const scale  = Math.max(scaleX, scaleY);
  const tx = (W - 800 * scale) / 2;
  const ty = (H - 900 * scale) / 2;
  const world = document.getElementById('iso-world');
  world.style.transition = 'none';
  world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  setTimeout(() => { world.style.transition = 'transform .7s cubic-bezier(0.22,1,0.36,1)'; }, 50);
}

window.addEventListener('resize', initCamera);

// ═══════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════
function openPanel(room) {
  const panel = document.getElementById('data-panel');
  panel.classList.add('open');
  const titles = { mrs: '📊 TRADING FLOOR', apgar: '🏆 RESEARCH ROOM', tracker: '💼 PORTFOLIO ROOM' };

}
function closePanel() {
  document.getElementById('data-panel').classList.remove('open');
}
function togglePanel() {
  document.getElementById('data-panel').classList.toggle('open');
  if (document.getElementById('data-panel').classList.contains('open')) {

function renderPanel(room) {
  const body = document.getElementById('panel-body');
  if (!_dados) { body.innerHTML = '<div class="p-empty">Aguardando dados da API...</div>'; return; }
  if (room === 'mrs')     body.innerHTML = buildMRSPanel(_dados);
  else if (room === 'apgar')   body.innerHTML = buildAPGARPanel(_dados);
  else if (room === 'tracker') body.innerHTML = buildTrackerPanel();
}

function buildTrackerPanel() {
  const posicoes = carregarPosicoes();
  const abertas = posicoes.filter(p => !p.fechada);
  const fechadas = posicoes.filter(p => p.fechada);
  const wins = fechadas.filter(p => (p.pnl_fechamento||0) > 0).length;
  const winrate = fechadas.length > 0 ? Math.round(wins/fechadas.length*100) : 0;
  const pnls = fechadas.map(p => p.pnl_fechamento||0);
  const pnlMed = pnls.length > 0 ? pnls.reduce((a,b)=>a+b,0)/pnls.length : 0;
  const pnlTot = pnls.reduce((a,b)=>a+b,0);

  let html = '<div class="p-section">';
  html += '<div class="p-stat-row">';
  html += '<div class="p-stat"><div class="p-stat-label">Abertas</div><div class="p-stat-value g">' + abertas.length + '</div></div>';
  html += '<div class="p-stat"><div class="p-stat-label">Win Rate</div><div class="p-stat-value y">' + (fechadas.length ? winrate + '%' : '—') + '</div></div>';
  const pmc = pnlMed >= 0 ? 'g' : 'r';
  const ptc = pnlTot >= 0 ? 'g' : 'r';
  html += '<div class="p-stat"><div class="p-stat-label">P&L Médio</div><div class="p-stat-value ' + pmc + '">' + (pnls.length ? (pnlMed>=0?'+':'') + pnlMed.toFixed(2) + '%' : '—') + '</div></div>';
  html += '<div class="p-stat"><div class="p-stat-label">P&L Total</div><div class="p-stat-value ' + ptc + '">' + (pnls.length ? (pnlTot>=0?'+':'') + pnlTot.toFixed(2) + '%' : '—') + '</div></div>';
  html += '</div></div>';

  html += '<button class="btn-add" onclick="abrirModal()">+ REGISTRAR SINAL VCP</button>';

  html += '<div class="p-section"><div class="p-section-title">Posições Abertas</div>';
  if (!abertas.length) { html += '<div class="p-empty">Nenhuma posição aberta</div>'; }
  else abertas.forEach(p => {
    const precoAtual = p._preco_atual || p.entrada;
    const pnl = (precoAtual / p.entrada - 1) * 100;
    const dias = diasCorridos(p.data);
    const pct = Math.min(100, Math.round(dias/7*100));
    const st = statusPosicao(p, precoAtual);
    const pillCls = st==='open'?'pill-open':st==='tp'?'pill-tp':'pill-ts';
    const pillLbl = st==='open'?'ABERTA':st==='tp'?'TP +5%':'T.STOP';
    const pnlCls = pnl >= 0 ? 'g' : 'r';
    html += '<div class="p-trk-row">';
    html += '<span class="p-ticker" style="font-size:10px">' + p.ticker + '</span>';
    html += '<div style="font-size:9px"><div>Entrada: R$' + p.entrada.toFixed(2) + '</div>';
    html += '<div>Atual: R$' + precoAtual.toFixed(2) + '</div>';
    html += '<div style="height:3px;background:var(--border);border-radius:2px;margin-top:3px"><div style="width:' + pct + '%;height:100%;background:' + (dias>=7?'var(--red)':dias>=5?'var(--yellow)':'var(--green)') + ';border-radius:2px"></div></div>';
    html += '</div>';
    html += '<span class="p-val ' + pnlCls + '" style="font-size:10px;font-weight:700">' + (pnl>=0?'+':'') + pnl.toFixed(2) + '%</span>';
    html += '<span class="p-trk-pill ' + pillCls + '">' + pillLbl + '</span>';
    html += '</div>';
  });
  html += '</div>';

  const ult = fechadas.slice(-10).reverse();
  if (ult.length) {
    html += '<div class="p-section"><div class="p-section-title">Últimas Fechadas</div>';
    ult.forEach(p => {
      const pnl = p.pnl_fechamento || 0;
      const pnlCls = pnl >= 0 ? 'g' : 'r';
      const mot = p.motivo_fechamento || '—';
      const pillCls = mot==='tp'?'pill-tp':'pill-ts';
      const pillLbl = mot==='tp'?'TP +5%':'T.STOP';
      html += '<div class="p-trk-row">';
      html += '<span class="p-ticker" style="font-size:10px;opacity:.7">' + p.ticker + '</span>';
      html += '<div style="font-size:9px;opacity:.7"><div>Entrada: R$' + p.entrada.toFixed(2) + '</div>';
      html += '<div>' + (p.dias_aberta||0) + ' dias</div></div>';
      html += '<span class="p-val ' + pnlCls + '" style="font-size:10px;font-weight:700;opacity:.8">' + (pnl>=0?'+':'') + pnl.toFixed(2) + '%</span>';
      html += '<span class="p-trk-pill ' + pillCls + '">' + pillLbl + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

function updateTrackerISO() {
  const posicoes = carregarPosicoes();
  const abertas = posicoes.filter(p => !p.fechada);
  const fechadas = posicoes.filter(p => p.fechada);
  const wins = fechadas.filter(p => (p.pnl_fechamento||0) > 0).length;
  const winrate = fechadas.length ? Math.round(wins/fechadas.length*100) : null;
  const pnls = fechadas.map(p => p.pnl_fechamento||0);
  const pnlMed = pnls.length > 0 ? pnls.reduce((a,b)=>a+b,0)/pnls.length : null;

  document.getElementById('trk-abertas').textContent = abertas.length;
  document.getElementById('trk-winrate').textContent = winrate !== null ? winrate + '%' : '—';
  document.getElementById('trk-pnlmed').textContent = pnlMed !== null ? (pnlMed>=0?'+':'') + pnlMed.toFixed(2) + '%' : '—';
  document.getElementById('trk-fechadas').textContent = fechadas.length;

  // Cards de posição
  abertas.slice(0,3).forEach((p,i) => {
    const precoAtual = p._preco_atual || p.entrada;
    const pnl = (precoAtual / p.entrada - 1) * 100;
    const el = document.getElementById('card' + (i+1) + '-ticker');

      pe.textContent = (pnl>=0?'+':'') + pnl.toFixed(2) + '%';
      pe.setAttribute('fill', pnl >= 0 ? '#00f0a080' : '#ff3d5a80');
    }
  });
}

function animateChart(id, acao) {
  const el = document.getElementById(id);
  if (!el) return;
  // Gera uma curva baseada no MRS/RSV da ação
  if (!acao) return;
  const base = [200,218,230,248,265,280];
  const yBase = 440;
  const range = 25;
  const mrs = acao.mrs || 0;
  const points = base.map((x, i) => {
    const frac = i / (base.length - 1);
    const y = yBase - (frac * range) - (mrs > 0 ? Math.sin(frac * Math.PI) * 8 : 0) + (Math.random() * 4 - 2);
    return x + ',' + y.toFixed(0);
  }).join(' ');
  el.setAttribute('points', points);
}

// ═══════════════════════════════════════════════════════
// SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════════════════════
function initAudio() {
  if (_audioCtx) return;
  _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!_soundOn || !_audioCtx) return;
  const ctx = _audioCtx;
  const now = ctx.currentTime;

  if (type === 'swoosh') {
    // Som de transição rápido
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);

  } else if (type === 'chime') {
    // Som de sino para APGAR
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.08, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.5);
    });

  } else if (type === 'tick') {
    // Som de tick para tracker
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);

  } else if (type === 'ambient') {
    // Teclado de escritório — série de ticks suaves
    for (let i = 0; i < 4; i++) {
      const delay = Math.random() * 0.8;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 800 + Math.random() * 400;
      gain.gain.setValueAtTime(0.02, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.03);
      osc.start(now + delay); osc.stop(now + delay + 0.03);
    }
  }
}

function toggleSound() {
  initAudio();
  _soundOn = !_soundOn;
  const btn = document.getElementById('snd-btn');
  btn.textContent = _soundOn ? '♪ SOM ON' : '♪ SOM';
  btn.style.color = _soundOn ? 'var(--green)' : '';
  btn.style.borderColor = _soundOn ? 'var(--green)' : '';
  if (_soundOn) {
    // Toca som de ambiente periodicamente
    setInterval(() => { if (_soundOn) playSound('ambient'); }, 3000 + Math.random() * 2000);
  }
}

// ═══════════════════════════════════════════════════════
// TRACKER LOGIC
// ═══════════════════════════════════════════════════════
function carregarPosicoes() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); } catch(e) { return []; }
}
function salvarPosicoes(arr) { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
function diasCorridos(dataStr) {
  return Math.floor((new Date() - new Date(dataStr + 'T00:00:00')) / 86400000);
}
function statusPosicao(pos, precoAtual) {
  const pnl = (precoAtual / pos.entrada - 1) * 100;
  const dias = diasCorridos(pos.data);
  if (pos.fechada) return pos.motivo_fechamento || 'fechada';
  if (pnl >= TP_PCT * 100) return 'tp';
  if (dias >= 7) return 'time_stop';
  return 'open';
}
function autoRegistrarSinaisVCP(dados) {
  if (!dados?.apgar?.acoes) return;
  const hoje = new Date().toISOString().split('T')[0];
  const posicoes = carregarPosicoes();
  const existentes = new Set(posicoes.filter(p=>p.data===hoje).map(p=>p.ticker));
  dados.apgar.acoes.forEach(a => {
    if (a.score>=5 && a.score<=8 && a.scores?.breakout===2 && a.mrs>0 && a.rsv>0 && !existentes.has(a.ticker)) {
      posicoes.push({ id: Date.now()+'_'+a.ticker, ticker:a.ticker, entrada:a.preco,
        score:a.score, data:hoje, ibov_entrada:null, notas:'VCP auto', fechada:false, _preco_atual:a.preco });
      existentes.add(a.ticker);
    }
  });
  salvarPosicoes(posicoes);
}
function atualizarPrecos(dados) {
  if (!dados) return;
  const posicoes = carregarPosicoes();
  let updated = false;
  posicoes.forEach(p => {
    if (p.fechada) return;
    const acoes = dados.apgar?.acoes || [];
    const acao = acoes.find(a => a.ticker === p.ticker);
    if (acao && acao.preco !== p._preco_atual) { p._preco_atual = acao.preco; updated = true; }
  });
  if (updated) salvarPosicoes(posicoes);
}
function abrirModal() {
  document.getElementById('mData').value = new Date().toISOString().split('T')[0];
  ['mTicker','mEntrada','mScore','mNotas'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('mTicker').focus(), 100);
}

function salvarSinal() {
  const ticker = document.getElementById('mTicker').value.trim().toUpperCase();

}

async function atualizarDados(tentativa=1, max=3) {
  loadingProgress(20 + tentativa * 20, 'CONECTANDO À API...');
  try {
    const r = await fetch('/api/screener', {cache:'default'});
    if (r.status === 404) throw new Error('API 404');
    if (!r.ok) throw new Error('Erro ' + r.status);
    const d = await r.json();
    if (d.error && d.retry) {
      document.getElementById('updateTime').innerHTML = '<span style="color:var(--yellow)">⏳ ' + d.error + '</span>';
      if (tentativa < max) setTimeout(() => atualizarDados(tentativa+1, max), 10000);
      return;
    }
    _dados = d;
    onDadosCarregados(d);
  } catch(e) {
    console.error(e);
    document.getElementById('updateTime').innerHTML = '<span style="color:var(--yellow)">⚠ DEMO</span>';
    _dados = DEMO;
    onDadosCarregados(DEMO);
  }
}

function onDadosCarregados(d) {
  loadingProgress(100, 'SISTEMAS ONLINE');
  document.getElementById('updateTime').textContent = d._demo ? '⚠ DEMO' : (d.lastUpdate || '—');
  if (!d._demo) {
    autoRegistrarSinaisVCP(d);
    atualizarPrecos(d);
  }
  renderISO(d);
  updateTrackerISO();
  if (document.getElementById('data-panel').classList.contains('open')) {
    renderPanel(_currentRoom);
  }
  playSound('ambient');
  setTimeout(hideLoading, 400);
}

async function forceUpdate(event) {
  const btn = event.currentTarget;
  btn.disabled = true; btn.textContent = '⏳ ...';
  triggerFugazi();
  try {
    const r = await fetch('/api/screener?force=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('Erro');
    _dados = await r.json();
    onDadosCarregados(_dados);
    btn.textContent = '✅ OK';
  } catch(e) { btn.textContent = '❌ ERR'; }
  finally { setTimeout(() => { btn.textContent = '↻ UPDATE'; btn.disabled = false; }, 2000); }
}

// ── SPRITE.PNG — APGAR ──
(function() {
  const SP = { FILE:'sprite.png', COLS:5, ROWS:2, TOTAL:10, FW:290, FH:290, FPS:11, LOOPS:3 };
  let _img=null,_loaded=false,_timer=null,_frame=0,_loop=0,_running=false;
  function preload() {
    if(_img) return; _img=new Image();
    _img.onload=()=>{_loaded=true};_img.onerror=()=>console.warn('[Sprite] não encontrado');
    _img.src=SP.FILE;
  }
  preload();
  function drawFrame(fi) {
    const canvas=document.getElementById('apgar-sprite-canvas');
    if(!canvas||!_loaded) return;
    const W=canvas.width=canvas.offsetWidth||window.innerWidth;
    const H=canvas.height=canvas.offsetHeight||window.innerHeight;
    const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,W,H);
    const ts=Math.max(W,H)/2;
    const col=fi%SP.COLS,row=Math.floor(fi/SP.COLS);
    ctx.drawImage(_img,col*SP.FW,row*SP.FH,SP.FW,SP.FH,(W-ts)/2,(H-ts)/2,ts,ts);
  }
  function stop() { if(_timer){clearInterval(_timer);_timer=null} _running=false; }
  function triggerSlide() {
    const ov=document.getElementById('apgar-sprite-overlay');
    ov.classList.add('slide-left-out');
    setTimeout(()=>{ stop(); ov.style.display='none'; ov.style.visibility='hidden'; ov.classList.remove('slide-left-out'); _frame=0;_loop=0; },580);
  }
  function play() {
    if(_running) return;
    if(!_loaded){setTimeout(play,300);return}
    const ov=document.getElementById('apgar-sprite-overlay');
    ov.style.display='block'; ov.style.visibility='visible';
    ov.classList.remove('slide-left-out');
    _frame=0;_loop=0;_running=true; drawFrame(0);
    _timer=setInterval(()=>{
      _frame++;
      if(_frame>=SP.TOTAL){_frame=0;_loop++;if(_loop>=SP.LOOPS){stop();triggerSlide();return}}
      drawFrame(_frame);
    }, Math.round(1000/SP.FPS));
  }
  window.triggerApgarSprite=play;
})();

// ── SPRITE2.PNG — FUGAZI ──
(function() {
  const SP2={FILE:'sprite2.png',COLS:5,ROWS:2,TOTAL:10,FW:290,FH:290,FPS:11,LOOPS:3};
  let _img=null,_loaded=false,_timer=null,_running=false,_hide=null;
  function preload(){if(_img)return;_img=new Image();_img.onload=()=>{_loaded=true};_img.onerror=()=>console.warn('[Sprite2] não encontrado');_img.src=SP2.FILE}
  preload();
  function sizeCanvas(){
    const canvas=document.getElementById('fugazi-canvas'),balloon=document.getElementById('fugazi-balloon');
    if(!canvas||!balloon) return;
    const bH=balloon.offsetHeight+40;
    canvas.width=window.innerWidth; canvas.height=Math.max(window.innerHeight-52-bH,120);
  }
  function draw(fi){
    const canvas=document.getElementById('fugazi-canvas');
    if(!canvas||!_loaded) return; sizeCanvas();
    const W=canvas.width,H=canvas.height,ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    const ts=Math.max(W,H)/2,col=fi%SP2.COLS,row=Math.floor(fi/SP2.COLS);
    ctx.drawImage(_img,col*SP2.FW,row*SP2.FH,SP2.FW,SP2.FH,(W-ts)/2,(H-ts)/2,ts,ts);
  }
  function stop(){if(_timer){clearInterval(_timer);_timer=null}_running=false}
  function slideOut(){
    const c=document.getElementById('fugazi-container');
    c.classList.remove('slide-in'); c.classList.add('slide-out');
    setTimeout(()=>{c.classList.remove('slide-out');c.style.visibility='hidden';stop()},420);
  }
  function play(){
    if(_running)return; if(!_loaded){setTimeout(play,300);return}
    if(_hide){clearTimeout(_hide);_hide=null}
    const c=document.getElementById('fugazi-container');
    c.classList.remove('slide-out'); c.style.left=''; c.style.visibility='visible';
    void c.offsetWidth; c.classList.add('slide-in');
    let frame=0,loop=0; _running=true; draw(0);
    _timer=setInterval(()=>{
      frame++; if(frame>=SP2.TOTAL){frame=0;loop++;if(loop>=SP2.LOOPS){stop();_hide=setTimeout(slideOut,3000);return}}
      draw(frame);
    },Math.round(1000/SP2.FPS));
  }
  window.triggerFugazi=play;
  window.addEventListener('resize',()=>{if(_running)sizeCanvas()});
})();

// ── SPRITE_WALK.PNG — TRACKER ──
(function() {
  const SW={FILE:'sprite_walk.png',COLS:4,ROWS:2,TOTAL:8,FPS:15};
  let _loaded=false,_timer=null,_raf=null,_running=false,_fw=1,_fh=1;
  const _img=new Image();
  _img.onload=()=>{_fw=_img.naturalWidth/SW.COLS;_fh=_img.naturalHeight/SW.ROWS;_loaded=true};
  _img.onerror=()=>console.warn('[Walk] não encontrado');
  _img.src=SW.FILE;
  function getEl(){return document.getElementById('walk-sprite')}
  function applyFrame(fi){
    const el=getEl(); if(!el||!_loaded) return;
    const dW=el.offsetWidth||140,dH=el.offsetHeight||140;
    const sX=dW/_fw,sY=dH/_fh,col=fi%SW.COLS,row=Math.floor(fi/SW.COLS);
    el.style.backgroundSize=(SW.COLS*_fw*sX)+'px '+(SW.ROWS*_fh*sY)+'px';
    el.style.backgroundPosition=(-col*_fw*sX)+'px '+(-row*_fh*sY)+'px';
  }
  function stop(){if(_timer){clearInterval(_timer);_timer=null}if(_raf){cancelAnimationFrame(_raf);_raf=null}_running=false}
  function play(){
    if(_running)return; if(!_loaded){setTimeout(play,300);return}
    const el=getEl(); if(!el) return;
    const totalW=window.innerWidth+200; let posX=-160;
    const speed=Math.ceil(totalW/240); let frame=0;
    el.style.right='auto'; el.style.left=posX+'px'; el.style.visibility='visible';
    _running=true; applyFrame(0);
    _timer=setInterval(()=>{frame=(frame+1)%SW.TOTAL;applyFrame(frame)},Math.round(1000/SW.FPS));
    function andar(){posX+=speed;el.style.left=posX+'px';if(posX<window.innerWidth+10){_raf=requestAnimationFrame(andar)}else{stop();el.style.visibility='hidden';el.style.left='-160px'}}
    _raf=requestAnimationFrame(andar);
  }
  window.triggerWalkSprite=play;
  window.addEventListener('resize',()=>{if(!_running){const el=getEl();if(el)el.style.left='-160px'}});
})();
