<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBOV · Asset Management</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Press+Start+2P&family=Bangers&display=swap" rel="stylesheet">
<style>
/* ── PALETA ── */
:root {
  --floor:    #6B7FA3;
  --floor2:   #7B8FB5;
  --wall:     #D4845A;
  --wall-dk:  #B86A3C;
  --desk:     #C97B3E;
  --desk-dk:  #A55E28;
  --win-bg:   #A8D4E6;
  --win-fr:   #6A9AB4;
  --mon:      #2A2A3A;
  --screen:   #C8ECD8;
  --paper:    #F8F4EC;
  --shadow:   rgba(0,0,0,.18);
  --tile:     #7B8FB5;
  --red-ch:   #E05A4A;
  --grn-ch:   #5AB85A;
  --blu-ch:   #4AB8D4;
  --shelf:    #B87040;

  --ui-bg:    #F5EFE6;
  --ui-surf:  #EDE6DA;
  --ui-brd:   #C8B89A;
  --ui-text:  #2A1F14;
  --ui-muted: #7A6A58;
  --ui-green: #2D7A4A;
  --ui-yellow:#8A6A10;
  --ui-red:   #8A2A1A;
  --ui-blue:  #1A5A8A;
  --ui-purple:#5A3A8A;
  --mono: 'Space Mono', monospace;
  --pixel: 'Press Start 2P', monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3A3028;font-family:var(--mono);font-size:12px}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:48px;background:var(--ui-bg);border-bottom:2px solid var(--ui-brd);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
}
.logo{font-family:var(--pixel);font-size:7px;color:var(--ui-text);display:flex;align-items:center;gap:8px}
.logo-dot{width:7px;height:7px;border-radius:50%}
.topbar-right{display:flex;align-items:center;gap:10px}
.update-info{font-size:9px;color:var(--ui-muted);text-align:right}
.update-info b{color:var(--ui-text);font-size:10px}
.btn-top{background:var(--ui-surf);border:2px solid var(--ui-brd);color:var(--ui-text);
  padding:4px 12px;border-radius:4px;font-family:var(--pixel);font-size:6px;cursor:pointer;
  transition:.15s;letter-spacing:.5px}
.btn-top:hover{background:var(--ui-brd);border-color:var(--ui-text)}
.btn-top.snd-on{border-color:var(--ui-green);color:var(--ui-green)}

/* ── BOTTOM NAV ── */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:50px;background:var(--ui-bg);border-top:2px solid var(--ui-brd);
  display:flex;align-items:stretch;
}
.room-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--pixel);font-size:6px;letter-spacing:.5px;
  background:transparent;border:none;border-top:3px solid transparent;
  color:var(--ui-muted);cursor:pointer;transition:.15s;
}
.room-btn:hover{background:var(--ui-surf);color:var(--ui-text)}
.room-btn.active{color:var(--ui-text);background:var(--ui-surf)}
.room-btn.active.r-mrs{border-top-color:#2D7A4A}
.room-btn.active.r-apgar{border-top-color:#5A3A8A}
.room-btn.active.r-tracker{border-top-color:#8A6A10}
.room-icon{font-size:14px}

/* ── STAGE ── */
#stage{
  position:fixed;top:48px;left:0;right:0;bottom:50px;
  overflow:hidden;background:#3A3028;
}
#world{
  height:100%;display:flex;
  transition:transform .65s cubic-bezier(0.22,1,0.36,1);
  transform:translateX(0);
  image-rendering:pixelated;
}

/* ── ROOMS ── */
.room{
  flex-shrink:0;width:100vw;height:100%;
  position:relative;overflow:hidden;
  image-rendering:pixelated;
}
.room-svg{width:100%;height:100%;display:block;image-rendering:pixelated}

/* ── SPRITE CANVAS ── */
#sprite-canvas{
  position:fixed;z-index:190;
  pointer-events:none;
  image-rendering:pixelated;
}

/* ── DATA PANEL ── */
#panel{
  position:fixed;right:0;top:48px;bottom:50px;width:320px;z-index:150;
  background:var(--ui-bg);border-left:2px solid var(--ui-brd);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(0.22,1,0.36,1);
}
#panel.open{transform:translateX(0)}
#ph{padding:12px 16px;border-bottom:2px solid var(--ui-brd);display:flex;align-items:center;justify-content:space-between;background:var(--ui-surf)}
#ph-title{font-family:var(--pixel);font-size:7px;color:var(--ui-text)}
#ph-close{background:transparent;border:none;color:var(--ui-muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:3px}
#ph-close:hover{background:var(--ui-brd);color:var(--ui-text)}
#pb{flex:1;overflow-y:auto;padding:14px 16px}
#pb::-webkit-scrollbar{width:4px}
#pb::-webkit-scrollbar-track{background:var(--ui-surf)}
#pb::-webkit-scrollbar-thumb{background:var(--ui-brd);border-radius:2px}

/* ── PANEL CONTENT ── */
.ps{margin-bottom:16px}
.ps-title{font-size:8px;color:var(--ui-muted);letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--ui-brd)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pstat{background:var(--ui-surf);border:1px solid var(--ui-brd);border-radius:5px;padding:8px 10px}
.pstat-lbl{font-size:7px;color:var(--ui-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.pstat-val{font-size:16px;font-weight:700;line-height:1;color:var(--ui-text)}
.pstat-val.g{color:var(--ui-green)}.pstat-val.y{color:var(--ui-yellow)}.pstat-val.r{color:var(--ui-red)}
.prow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(90,70,50,.1)}
.prow:last-child{border-bottom:none}
.pticker{font-size:11px;font-weight:700;color:var(--ui-text)}
.pval{font-size:10px}.pval.g{color:var(--ui-green)}.pval.r{color:var(--ui-red)}.pval.y{color:var(--ui-yellow)}
.ppill{font-size:7px;padding:2px 7px;border-radius:3px;font-weight:700}
.ppill.buy{background:#D4EDE0;color:var(--ui-green);border:1px solid #A8D4B8}
.ppill.sell{background:#EDD4D4;color:var(--ui-red);border:1px solid #D4A8A8}
.pscore{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(90,70,50,.1)}
.pscore:last-child{border-bottom:none}
.sbadge{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.s-forte{background:#D4EDE0;color:var(--ui-green);border:1px solid #A8D4B8}
.s-pos{background:#EDE4C8;color:var(--ui-yellow);border:1px solid #D4C890}
.s-neu{background:var(--ui-surf);color:var(--ui-text);border:1px solid var(--ui-brd)}
.s-frac{background:#EDD4D4;color:var(--ui-red);border:1px solid #D4A8A8}
.pdots{display:flex;gap:3px;margin-top:3px}
.pdot{width:7px;height:7px;border-radius:2px}
.pd2{background:#2D7A4A}.pd1{background:#8A6A10}.pd0{background:#C8B89A}
.pfilter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.pfbtn{font-size:7px;padding:3px 9px;border-radius:12px;border:1px solid var(--ui-brd);
  background:transparent;color:var(--ui-muted);cursor:pointer;transition:.15s;font-family:var(--mono)}
.pfbtn:hover,.pfbtn.active{background:var(--ui-surf);border-color:var(--ui-text);color:var(--ui-text)}
.psearch{width:100%;background:var(--ui-surf);border:1px solid var(--ui-brd);border-radius:4px;
  padding:5px 9px;font-family:var(--mono);font-size:10px;color:var(--ui-text);outline:none;margin-bottom:10px}
.psearch:focus{border-color:var(--ui-blue)}
.btn-add-pos{width:100%;background:var(--ui-surf);border:2px solid var(--ui-green);color:var(--ui-green);
  padding:7px;border-radius:4px;font-family:var(--pixel);font-size:6px;cursor:pointer;margin-bottom:10px;
  letter-spacing:.5px;transition:.15s}
.btn-add-pos:hover{background:#D4EDE0}
.ptrk{display:grid;grid-template-columns:70px 1fr 58px;align-items:center;gap:6px;
  padding:6px 0;border-bottom:1px solid rgba(90,70,50,.1)}
.ptrk:last-child{border-bottom:none}
.tpill{font-size:7px;padding:2px 5px;border-radius:3px;font-weight:700;text-align:center}
.tp-open{background:#D4EDE0;color:var(--ui-green)}
.tp-tp{background:#D4E0ED;color:var(--ui-blue)}
.tp-ts{background:var(--ui-surf);color:var(--ui-muted)}
.pempty{color:var(--ui-muted);font-size:9px;text-align:center;padding:20px 0}

/* ── MODAL ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(50,40,30,.6);z-index:300;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:var(--ui-bg);border:2px solid var(--ui-brd);border-radius:8px;padding:20px;width:300px}
.modal-title{font-family:var(--pixel);font-size:7px;color:var(--ui-green);margin-bottom:14px}
.fl{font-size:8px;color:var(--ui-muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;background:var(--ui-surf);border:1px solid var(--ui-brd);border-radius:4px;
  padding:6px 9px;font-family:var(--mono);font-size:10px;color:var(--ui-text);outline:none;margin-bottom:9px}
.fi:focus{border-color:var(--ui-green)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mactions{display:flex;gap:8px;margin-top:10px}
.btn-ok{flex:1;background:var(--ui-green);color:white;border:none;padding:8px;border-radius:4px;font-family:var(--pixel);font-size:6px;cursor:pointer}
.btn-cn{flex:1;background:transparent;border:1px solid var(--ui-brd);color:var(--ui-muted);padding:8px;border-radius:4px;font-family:var(--pixel);font-size:6px;cursor:pointer}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;z-index:500;
  background:var(--ui-bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;transition:opacity .5s;
}
#loading.hide{opacity:0;pointer-events:none}
#load-title{font-family:var(--pixel);font-size:9px;color:var(--ui-green);letter-spacing:2px}
#load-bar{width:200px;height:6px;background:var(--ui-brd);border-radius:3px;overflow:hidden}
#load-fill{height:100%;background:var(--ui-green);width:0;transition:width .3s;border-radius:3px}
#load-msg{font-size:8px;color:var(--ui-muted);letter-spacing:1px}

/* ── FUGAZI ── */
#fugazi-wrap{
  position:fixed;top:48px;left:-110vw;width:100vw;z-index:185;
  pointer-events:none;visibility:hidden;
  display:flex;flex-direction:column;align-items:center;
  transition:left .45s cubic-bezier(.22,1,.36,1);
}
#fugazi-wrap.fi{left:0;visibility:visible}
#fugazi-wrap.fo{left:110vw;visibility:visible;transition:left .4s cubic-bezier(.55,0,1,.45)}
#fugazi-balloon{
  position:relative;background:#fff;border:4px solid #333;border-radius:24px;
  padding:10px 20px;margin:8px 20px 0;max-width:min(88vw,500px);
  box-shadow:4px 4px 0 #333;
}
#fugazi-balloon::after{content:'';position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);
  border:12px solid transparent;border-top-color:#333}
#fugazi-balloon::before{content:'';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  border:10px solid transparent;border-top-color:#fff;z-index:1}
#fugazi-text{font-family:'Bangers',cursive;font-size:clamp(20px,5vw,36px);color:#333;
  letter-spacing:2px;text-align:center;text-shadow:2px 2px 0 #ddd}
#fugazi-canvas{display:block;width:100vw;image-rendering:pixelated}
#walk-sprite{position:fixed;bottom:58px;width:140px;height:140px;z-index:188;
  pointer-events:none;visibility:hidden;
  image-rendering:pixelated;background-image:url('sprite_walk.png');background-repeat:no-repeat}
#apgar-ov{display:none;position:fixed;inset:0;z-index:400;pointer-events:none;visibility:hidden}
#apgar-ov.visible{visibility:visible}
#apgar-canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#apgar-ov.slo{animation:slo .55s cubic-bezier(.55,0,1,.45) forwards}
@keyframes slo{from{transform:translateX(0);opacity:1}to{transform:translateX(-110vw);opacity:0}}

@media(max-width:600px){
  #panel{width:100%;border-left:none;border-top:2px solid var(--ui-brd)}
  .room-btn span{display:none}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">
    <div class="logo-dot" style="background:#2D7A4A"></div>
    <div class="logo-dot" style="background:#8A6A10"></div>
    <div class="logo-dot" style="background:#8A2A1A"></div>
    IBOV ASSET MGMT
  </div>
  <div class="topbar-right">
    <div class="update-info">ÚLTIMA ATT: <b id="updateTime">—</b></div>
    <button class="btn-top" id="snd-btn" onclick="toggleSound()">♪ SOM</button>
    <button class="btn-top" onclick="forceUpdate(event)">↻ UPDATE</button>
  </div>
</div>

<!-- STAGE + WORLD + ROOMS -->
<div id="stage">
<div id="world">

  <!-- SALA 1: TRADING FLOOR -->
  <div class="room" id="room-mrs">
    <svg class="room-svg" viewBox="0 0 800 580" preserveAspectRatio="xMidYMid slice">
      <!-- FUNDO/PISO -->
      <rect width="800" height="580" fill="#6B7FA3"/>
      <!-- Sombras de tile no piso -->
      <g opacity="0.18" fill="none" stroke="#3A4A68" stroke-width="0.8">
        <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
        <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
        <line x1="0" y1="500" x2="800" y2="500"/>
        <line x1="100" y1="0" x2="100" y2="580"/><line x1="200" y1="0" x2="200" y2="580"/>
        <line x1="300" y1="0" x2="300" y2="580"/><line x1="400" y1="0" x2="400" y2="580"/>
        <line x1="500" y1="0" x2="500" y2="580"/><line x1="600" y1="0" x2="600" y2="580"/>
        <line x1="700" y1="0" x2="700" y2="580"/>
      </g>
      <!-- Tile pattern text -->
      <g font-family="Space Mono" font-size="8" fill="#7B8FB5" opacity="0.5">
        <text x="50" y="175">CCr</text><text x="250" y="275">CCr</text>
        <text x="450" y="175">CCr</text><text x="650" y="275">CCr</text>
        <text x="150" y="375">CCr</text><text x="350" y="475">CCr</text>
        <text x="550" y="375">CCr</text><text x="750" y="475">CCr</text>
      </g>

      <!-- PAREDE NORTE -->
      <rect x="0" y="0" width="800" height="110" fill="#D4845A"/>
      <rect x="0" y="105" width="800" height="8" fill="#B86A3C"/>

      <!-- JANELA (esquerda) -->
      <rect x="40" y="15" width="240" height="75" rx="3" fill="#B86A3C"/>
      <rect x="44" y="19" width="232" height="67" rx="2" fill="#A8D4E6"/>
      <!-- Reflexo janela -->
      <rect x="50" y="22" width="70" height="58" fill="rgba(255,255,255,0.25)" rx="1"/>
      <rect x="128" y="22" width="70" height="58" fill="rgba(255,255,255,0.2)" rx="1"/>
      <rect x="206" y="22" width="66" height="58" fill="rgba(255,255,255,0.22)" rx="1"/>
      <!-- Divisões janela -->
      <line x1="122" y1="19" x2="122" y2="86" stroke="#6A9AB4" stroke-width="3"/>
      <line x1="200" y1="19" x2="200" y2="86" stroke="#6A9AB4" stroke-width="3"/>
      <!-- Parapeito -->
      <rect x="38" y="86" width="244" height="12" fill="#B86A3C"/>
      <rect x="30" y="96" width="260" height="8" fill="#C97B3E"/>

      <!-- CAIXAS (esquerda parede) -->
      <rect x="30" y="108" width="55" height="45" rx="2" fill="#C97B3E" stroke="#A55E28" stroke-width="1.5"/>
      <rect x="30" y="148" width="55" height="25" rx="2" fill="#A55E28" stroke="#8A4A1C" stroke-width="1.5"/>
      <rect x="38" y="115" width="40" height="5" fill="#A55E28" opacity="0.5"/>

      <!-- ESTANTE/GABINETE (direita) -->
      <rect x="540" y="108" width="240" height="90" rx="3" fill="#C97B3E" stroke="#A55E28" stroke-width="2"/>
      <!-- Gavetas -->
      <rect x="545" y="113" width="110" height="37" rx="2" fill="#B87040" stroke="#A55E28" stroke-width="1"/>
      <rect x="545" y="154" width="110" height="37" rx="2" fill="#B87040" stroke="#A55E28" stroke-width="1"/>
      <!-- Puxadores -->
      <rect x="593" y="129" width="14" height="6" rx="3" fill="#A55E28"/>
      <rect x="593" y="170" width="14" height="6" rx="3" fill="#A55E28"/>
      <!-- Pastas coloridas dir -->
      <g transform="translate(660,115)">
        <rect x="0"  y="0" width="13" height="32" rx="1" fill="#E05A4A"/><rect x="14" y="0" width="13" height="32" rx="1" fill="#E8A030"/>
        <rect x="28" y="0" width="13" height="32" rx="1" fill="#E8D030"/><rect x="42" y="0" width="13" height="32" rx="1" fill="#58B848"/>
        <rect x="56" y="0" width="13" height="32" rx="1" fill="#4AB8D4"/><rect x="70" y="0" width="13" height="32" rx="1" fill="#8848C8"/>
        <rect x="84" y="0" width="13" height="32" rx="1" fill="#E848A0"/>
        <!-- Passas coloridas row 2 -->
        <rect x="0"  y="35" width="13" height="30" rx="1" fill="#4AB8D4"/><rect x="14" y="35" width="13" height="30" rx="1" fill="#E05A4A"/>
        <rect x="28" y="35" width="13" height="30" rx="1" fill="#58B848"/><rect x="42" y="35" width="13" height="30" rx="1" fill="#E8A030"/>
        <rect x="56" y="35" width="13" height="30" rx="1" fill="#8848C8"/><rect x="70" y="35" width="13" height="30" rx="1" fill="#E8D030"/>
        <rect x="84" y="35" width="13" height="30" rx="1" fill="#E848A0"/>
      </g>

      <!-- PAPÉIS na parede (centro) -->
      <g transform="translate(450,8)">
        <rect x="0" y="0" width="52" height="64" rx="2" fill="#F8F4EC" stroke="#DDD8CC" stroke-width="1" transform="rotate(-5,26,32)"/>
        <line x1="6" y1="16" x2="42" y2="16" stroke="#C8C4BC" stroke-width="1.5" transform="rotate(-5,26,32)"/>

        <line x1="6" y1="32" x2="40" y2="32" stroke="#C8C4BC" stroke-width="1.5" transform="rotate(-5,26,32)"/>
        <line x1="6" y1="40" x2="35" y2="40" stroke="#C8C4BC" stroke-width="1.5" transform="rotate(-5,26,32)"/>
      </g>

      <!-- TICKER MURAL (parede centro) — dados MRS -->
      <rect x="300" y="10" width="200" height="90" rx="4" fill="#2A2A3A" stroke="#1A1A28" stroke-width="2"/>
      <rect x="303" y="13" width="194" height="84" rx="2" fill="#141428"/>
      <text id="mrs-tb1" x="400" y="38" text-anchor="middle" fill="#00E880" font-family="Space Mono" font-size="10" font-weight="700">COMPRA: —</text>
      <text id="mrs-tb2" x="400" y="56" text-anchor="middle" fill="#F5C842" font-family="Space Mono" font-size="8">MRS — RSV —</text>
      <text id="mrs-tb3" x="400" y="72" text-anchor="middle" fill="#4A7A9A" font-family="Space Mono" font-size="7">PRÓX: — sinais</text>
      <text id="mrs-tb4" x="400" y="88" text-anchor="middle" fill="#3A5A7A" font-family="Space Mono" font-size="7" id="mrs-tb4">AÇÕES: —</text>

      <!-- MESA 1 (esquerda) -->
      <rect x="90" y="270" width="200" height="140" rx="4" fill="#C97B3E" stroke="#A55E28" stroke-width="2"/>
      <!-- Sombra mesa -->
      <rect x="96" y="406" width="200" height="12" rx="2" fill="rgba(0,0,0,0.2)"/>
      <!-- Pernas mesa -->
      <rect x="96"  y="400" width="14" height="28" rx="2" fill="#A55E28"/>
      <rect x="270" y="400" width="14" height="28" rx="2" fill="#A55E28"/>
      <!-- MONITOR 1 -->
      <rect x="108" y="235" width="110" height="76" rx="3" fill="#2A2A3A" stroke="#1A1A28" stroke-width="2"/>

<script>
// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let _dados=null, _filtro='todos', _search='', _room='mrs', _soundOn=false, _ctx=null;
const LS='ibov_tracker_v1', TP=0.05;

// ══════════════════════════════════════════════
// LOADING
// ══════════════════════════════════════════════
function lprog(p,m){
  document.getElementById('load-fill').style.width=p+'%';
  if(m) document.getElementById('load-msg').textContent=m;
}
function hideLoad(){
  const el=document.getElementById('loading');
  el.classList.add('hide');
  setTimeout(()=>el.style.display='none',600);
}

// ══════════════════════════════════════════════
// ROOM NAVIGATION
// ══════════════════════════════════════════════
const ROOM_IDX={mrs:0,apgar:1,tracker:2};

function goRoom(id,btn){
  const wasRoom=_room;
  _room=id;
  document.querySelectorAll('.room-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const idx=ROOM_IDX[id]||0;
  document.getElementById('world').style.transform='translateX(-'+(idx*100)+'vw)';
  // Sprite triggers
  if(id==='mrs'&&wasRoom!==id){ triggerFugazi(); playSound('swoosh'); }
  else if(id==='apgar'&&wasRoom!==id){ triggerApgar(); playSound('chime'); }
  else if(id==='tracker'&&wasRoom!==id){ triggerWalk(); playSound('tick'); }
  // Panel
  const p=document.getElementById('panel');
  if(p.classList.contains('open')){
    const titles={mrs:'📊 TRADING FLOOR',apgar:'🏆 RESEARCH ROOM',tracker:'💼 PORTFOLIO ROOM'};
    document.getElementById('ph-title').textContent=titles[id];
    renderPanel(id);
  }
}

function openPanel(id){
  _room=id;
  const p=document.getElementById('panel');
  p.classList.add('open');
  const titles={mrs:'📊 TRADING FLOOR',apgar:'🏆 RESEARCH ROOM',tracker:'💼 PORTFOLIO ROOM'};
  document.getElementById('ph-title').textContent=titles[id]||id;
  renderPanel(id);
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); }

// ══════════════════════════════════════════════
// PANEL
// ══════════════════════════════════════════════
function renderPanel(r){
  const b=document.getElementById('pb');
  if(!_dados){ b.innerHTML='<div class="pempty">Aguardando dados...</div>'; return; }
  if(r==='mrs') b.innerHTML=panelMRS(_dados);
  else if(r==='apgar') b.innerHTML=panelAPGAR(_dados);
  else b.innerHTML=panelTracker();
}

function panelMRS(d){
  const s=d.sinaisHoje||[], p=d.proximosCruzar||[], rec=d.cruzamentosRecentes||[];
  let h='<div class="ps"><div class="pstats">';
  h+='<div class="pstat"><div class="pstat-lbl">Sinais</div><div class="pstat-val g">'+s.length+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Compras</div><div class="pstat-val g">'+s.filter(x=>x.tipo==='COMPRA').length+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Próximos</div><div class="pstat-val y">'+p.length+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Ações</div><div class="pstat-val">'+(d.totalAcoes||'—')+'</div></div>';
  h+='</div></div>';
  h+='<div class="ps"><div class="ps-title">Sinais de Hoje</div>';
  if(!s.length) h+='<div class="pempty">Nenhum sinal hoje</div>';
  else s.forEach(x=>{
    h+='<div class="prow"><span class="pticker">'+x.ticker+'</span>';
    h+='<span class="ppill '+(x.tipo==='COMPRA'?'buy':'sell')+'">'+x.tipo+'</span>';
    h+='<span class="pval '+(x.mrs>=0?'g':'r')+'">MRS '+(x.mrs>=0?'+':'')+x.mrs.toFixed(1)+'%</span></div>';
  });
  h+='</div>';
  h+='<div class="ps"><div class="ps-title">Próximos de Cruzar</div>';
  if(!p.length) h+='<div class="pempty">Nenhum</div>';
  else p.slice(0,8).forEach(x=>{
    h+='<div class="prow"><span class="pticker">'+x.ticker+'</span>';
    h+='<span class="pval y">falta '+x.distancia.toFixed(2)+'%</span>';
    h+='<span class="pval '+(x.mrs>=0?'g':'r')+'">MRS '+(x.mrs>=0?'+':'')+x.mrs.toFixed(1)+'%</span></div>';
  });
  h+='</div>';
  h+='<div class="ps"><div class="ps-title">Top MRS</div>';
  (d.topMRS||[]).slice(0,10).forEach((x,i)=>{
    h+='<div class="prow"><span style="font-size:9px;color:var(--ui-muted)">'+(i+1)+'.</span>';
    h+='<span class="pticker">'+x.ticker+'</span>';
    h+='<span class="pval g">'+(x.mrs>=0?'+':'')+x.mrs.toFixed(2)+'%</span></div>';
  });
  h+='</div>';
  const recup=d.recuperacoes||[];
  if(recup.length){
    h+='<div class="ps"><div class="ps-title">Viradas</div>';
    recup.slice(0,6).forEach(x=>{
      h+='<div class="prow"><span class="pticker">'+x.ticker+'</span>';
      h+='<span class="pval" style="color:var(--ui-purple)">▲ '+x.dias_subindo+'d</span>';
      h+='<span class="pval" style="color:var(--ui-purple)">RSV '+x.dias_rsv_positivo+'d</span></div>';
    });
    h+='</div>';
  }
  return h;
}

function panelAPGAR(d){
  if(!d.apgar) return '<div class="pempty">Sem dados APGAR</div>';
  const r=d.apgar.resumo||{};
  let h='<div class="ps"><div class="pstats">';
  h+='<div class="pstat"><div class="pstat-lbl">Forte 9-10</div><div class="pstat-val g">'+(r.forte||0)+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Positivo 7-8</div><div class="pstat-val y">'+(r.positivo||0)+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Neutro 5-6</div><div class="pstat-val">'+(r.neutro||0)+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Fraco &lt;5</div><div class="pstat-val r">'+(r.fraco||0)+'</div></div>';
  h+='</div></div>';
  h+='<div class="ps"><div class="pfilter">';
  ['todos','FORTE','POSITIVO','NEUTRO','FRACO'].forEach(f=>{
    h+='<button class="pfbtn'+(_filtro===f?' active':'')+'" onclick="setFiltro(\''+f+'\',this)">'+f+'</button>';
  });
  h+='</div>';
  h+='<input class="psearch" type="text" placeholder="buscar ticker..." value="'+_search+'" oninput="setSearch(this.value)"></div>';
  let lista=d.apgar.acoes||[];
  if(_filtro!=='todos') lista=lista.filter(a=>a.classe===_filtro);
  if(_search) lista=lista.filter(a=>a.ticker.toLowerCase().includes(_search.toLowerCase()));
  h+='<div class="ps"><div class="ps-title">Ações ('+lista.length+')</div>';
  lista.slice(0,30).forEach(a=>{
    const sc=a.score;
    const cls=sc>=9?'s-forte':sc>=7?'s-pos':sc>=5?'s-neu':'s-frac';
    const keys=['tendencia','estagio','forca_relativa','contracao','breakout'];
    const dots=keys.map(k=>'<div class="pdot pd'+a.scores[k]+'"></div>').join('');
    h+='<div class="pscore"><div class="sbadge '+cls+'">'+sc+'</div>';
    h+='<div><div style="font-size:11px;font-weight:700;color:var(--ui-text)">'+a.ticker+'</div>';
    h+='<div class="pdots">'+dots+'</div></div>';
    h+='<div style="text-align:right"><div style="font-size:10px;color:var(--ui-text)">R$'+a.preco.toFixed(2)+'</div>';
    h+='<div class="pval '+(a.mrs>=0?'g':'r')+'" style="font-size:9px">MRS '+(a.mrs>=0?'+':'')+a.mrs.toFixed(1)+'%</div></div></div>';
  });
  if(lista.length>30) h+='<div class="pempty" style="font-size:8px">+'+( lista.length-30)+' mais</div>';
  h+='</div>';
  return h;
}

function panelTracker(){
  const pos=loadPos(), ab=pos.filter(p=>!p.fechada), fc=pos.filter(p=>p.fechada);
  const wins=fc.filter(p=>(p.pnl_fechamento||0)>0).length;
  const wr=fc.length?Math.round(wins/fc.length*100):null;
  const pnls=fc.map(p=>p.pnl_fechamento||0);
  const med=pnls.length?pnls.reduce((a,b)=>a+b,0)/pnls.length:null;
  const tot=pnls.reduce((a,b)=>a+b,0);
  let h='<div class="ps"><div class="pstats">';
  h+='<div class="pstat"><div class="pstat-lbl">Abertas</div><div class="pstat-val g">'+ab.length+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">Win Rate</div><div class="pstat-val y">'+(wr!==null?wr+'%':'—')+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">P&L Médio</div><div class="pstat-val '+(med!==null&&med>=0?'g':'r')+'">'+(med!==null?(med>=0?'+':'')+med.toFixed(2)+'%':'—')+'</div></div>';
  h+='<div class="pstat"><div class="pstat-lbl">P&L Total</div><div class="pstat-val '+(tot>=0?'g':'r')+'">'+(pnls.length?(tot>=0?'+':'')+tot.toFixed(2)+'%':'—')+'</div></div>';
  h+='</div></div>';
  h+='<button class="btn-add-pos" onclick="abrirModal()">+ REGISTRAR SINAL VCP</button>';
  h+='<div class="ps"><div class="ps-title">Posições Abertas</div>';
  if(!ab.length) h+='<div class="pempty">Nenhuma posição aberta</div>';
  else ab.forEach(p=>{
    const pa=p._preco_atual||p.entrada;
    const pnl=(pa/p.entrada-1)*100;
    const d=diasCorridos(p.data);
    const pct=Math.min(100,Math.round(d/7*100));
    const st=statusPos(p,pa);
    const pc=st==='open'?'tp-open':st==='tp'?'tp-tp':'tp-ts';
    const pl=st==='open'?'ABERTA':st==='tp'?'TP +5%':'T.STOP';
    h+='<div class="ptrk"><span class="pticker" style="font-size:10px">'+p.ticker+'</span>';
    h+='<div style="font-size:9px"><div>R$'+p.entrada.toFixed(2)+' → R$'+pa.toFixed(2)+'</div>';
    h+='<div style="height:3px;background:var(--ui-brd);border-radius:2px;margin-top:3px"><div style="width:'+pct+'%;height:100%;background:'+(d>=7?'#8A2A1A':d>=5?'#8A6A10':'#2D7A4A')+';border-radius:2px"></div></div></div>';
    h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">';
    h+='<span class="pval '+(pnl>=0?'g':'r')+'" style="font-size:10px;font-weight:700">'+(pnl>=0?'+':'')+pnl.toFixed(2)+'%</span>';
    h+='<span class="tpill '+pc+'">'+pl+'</span></div></div>';
  });
  h+='</div>';
  const ult=fc.slice(-8).reverse();
  if(ult.length){
    h+='<div class="ps"><div class="ps-title">Últimas Fechadas</div>';
    ult.forEach(p=>{
      const pnl=p.pnl_fechamento||0;
      const mot=p.motivo_fechamento||'—';
      const pc=mot==='tp'?'tp-tp':'tp-ts';
      h+='<div class="ptrk"><span class="pticker" style="font-size:10px;opacity:.7">'+p.ticker+'</span>';
      h+='<div style="font-size:9px;opacity:.7"><div>'+(p.dias_aberta||0)+'d · R$'+p.entrada.toFixed(2)+'</div></div>';
      h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">';
      h+='<span class="pval '+(pnl>=0?'g':'r')+'" style="font-size:10px;font-weight:700;opacity:.8">'+(pnl>=0?'+':'')+pnl.toFixed(2)+'%</span>';
      h+='<span class="tpill '+pc+'">'+mot.replace('_',' ')+'</span></div></div>';
    });
    h+='</div>';

function updateRooms(d){

  const top=s[0];
  const compras=s.filter(x=>x.tipo==='COMPRA').length;
  setText('mrs-tb1', top?'COMPRA: '+top.ticker:'SINAIS: '+compras);
  setText('mrs-tb2', top?'MRS:'+(top.mrs>=0?'+':'')+top.mrs.toFixed(1)+'  RSV:'+(top.rsv>=0?'+':'')+top.rsv.toFixed(1):'SEM SINAL HOJE');
  setText('mrs-tb3', 'PRÓX: '+p.length+' sinais');
  setText('mrs-tb4', 'AÇÕES: '+(d.totalAcoes||'—'));
  // Monitor 3 top MRS
  const tm=d.topMRS||[];
  setText('mon3-l1','1. '+(tm[0]?tm[0].ticker.padEnd(5)+'  '+(tm[0].mrs>=0?'+':'')+tm[0].mrs.toFixed(1)+'%':'——'));
  setText('mon3-l2','2. '+(tm[1]?tm[1].ticker.padEnd(5)+'  '+(tm[1].mrs>=0?'+':'')+tm[1].mrs.toFixed(1)+'%':'——'));
  setText('mon3-l3','3. '+(tm[2]?tm[2].ticker.padEnd(5)+'  '+(tm[2].mrs>=0?'+':'')+tm[2].mrs.toFixed(1)+'%':'——'));

  // Sala 2: APGAR board
  const ap=d.apgar||{}, res=ap.resumo||{}, acoes=ap.acoes||[];
  const topAcao=acoes.find(a=>a.score>=7);
  if(topAcao){
    setText('ab-score', topAcao.score);
    setText('ab-ticker', topAcao.ticker);
    setText('laptop-score', topAcao.score);
    // Barras
    const sc=topAcao.scores;
    setBar('ab-t', sc.tendencia/2);
    setBar('ab-e', sc.estagio/2);
    setBar('ab-r', sc.forca_relativa/2);
    setBar('ab-c', sc.contracao/2);
    setBar('ab-b', sc.breakout/2);
  }
  setText('ab-forte', (res.forte||'—')+' FORTE');
  setText('ab-pos', (res.positivo||'—')+' POSITIVO');
  setText('ab-frac', (res.fraco||'—')+' FRACO');
  // Top VCP no laptop
  const vcps=acoes.filter(a=>a.score>=5&&a.score<=8&&a.scores?.breakout===2&&a.mrs>0);
  setText('apg-top1', (vcps[0]?vcps[0].ticker.padEnd(5)+'  '+vcps[0].score+'/10':'——    —/10'));
  setText('apg-top2', (vcps[1]?vcps[1].ticker.padEnd(5)+'  '+vcps[1].score+'/10':'——    —/10'));
  setText('apg-top3', (vcps[2]?vcps[2].ticker.padEnd(5)+'  '+vcps[2].score+'/10':'——    —/10'));
  setText('apg-top4', (vcps[3]?vcps[3].ticker.padEnd(5)+'  '+vcps[3].score+'/10':'——    —/10'));

  // Sala 3: Tracker board
  updateTrackerRoom();
}

function updateTrackerRoom(){
  const pos=loadPos(), ab=pos.filter(p=>!p.fechada), fc=pos.filter(p=>p.fechada);
  const wins=fc.filter(p=>(p.pnl_fechamento||0)>0).length;
  const wr=fc.length?Math.round(wins/fc.length*100):null;
  const pnls=fc.map(p=>p.pnl_fechamento||0);
  const med=pnls.length?pnls.reduce((a,b)=>a+b,0)/pnls.length:null;
  setText('trk-ab', ab.length);
  setText('trk-wr', wr!==null?wr+'%':'—');
  setText('trk-pm', med!==null?(med>=0?'+':'')+med.toFixed(2)+'%':'—');
  setText('trk-fc', fc.length);
  // Posição nos cards visuais
  ab.slice(0,3).forEach((p,i)=>{
    const pa=p._preco_atual||p.entrada;
    const pnl=(pa/p.entrada-1)*100;
    const d=diasCorridos(p.data);
    const pct=Math.min(100,Math.round(d/7*100));
    const n=i+1;
    setText('c'+n+'-tck', p.ticker);
    const pe=document.getElementById('c'+n+'-pnl');
    if(pe){ pe.textContent=(pnl>=0?'+':'')+pnl.toFixed(2)+'%'; pe.setAttribute('fill',pnl>=0?'#2D7A4A':'#8A2A1A'); }
    setText('c'+n+'-dias', d+'d');
    const bar=document.getElementById('c'+n+'-bar');
    if(bar){ bar.setAttribute('width', Math.round(pct*0.94)); }
  });
}

function setText(id,v){const el=document.getElementById(id); if(el) el.textContent=v;}
function setBar(id,pct){
  const el=document.getElementById(id); if(!el) return;
  el.setAttribute('width', Math.round(pct*60));
  const col=pct>=1?'#2D7A4A':pct>=0.5?'#8A6A10':'#8A2A1A';
  el.setAttribute('fill', col);
}

const SPRITES={

// Personagem global
const CHAR={
  x:200, y:350,      // posição atual
  vx:0,              // velocidade
  dir:1,             // 1=direita, -1=esquerda
  mode:'walk',       // 'walk'|'idle1'|'idle2'
  frame:0,
  frameTimer:0,
  idleTimer:0,
  size:140,          // tamanho de display
  running:false,
};
let _charLoop=null;
let _charCanvas=null, _charCtx=null;

function onAllSpritesLoaded(){
  _charCanvas=document.getElementById('sprite-canvas');
  _charCtx=_charCanvas.getContext('2d');
  startCharLoop();
}

function startCharLoop(){
  if(_charLoop) return;
  CHAR.running=true;
  const stageEl=document.getElementById('stage');

  function loop(){
    if(!CHAR.running) return;
    const stW=stageEl.offsetWidth, stH=stageEl.offsetHeight;
    const sp=SPRITES[CHAR.mode];
    const now=Date.now();

    // Avança frame
    CHAR.frameTimer+=16;
    if(CHAR.frameTimer>=Math.round(1000/sp.fps)){
      CHAR.frameTimer=0;
      CHAR.frame=(CHAR.frame+1)%sp.total;
    }

    // Movimento se walking
    if(CHAR.mode==='walk'){
      CHAR.x+=CHAR.vx;
      // Rebate nas bordas
      if(CHAR.x<-20){ CHAR.x=-20; CHAR.vx=Math.abs(CHAR.vx); CHAR.dir=1; }
      if(CHAR.x>stW-CHAR.size+20){ CHAR.x=stW-CHAR.size+20; CHAR.vx=-Math.abs(CHAR.vx); CHAR.dir=-1; }
    }

    // Posiciona canvas
    _charCanvas.style.left=CHAR.x+'px';
    _charCanvas.style.top=(stH-CHAR.size-8)+'px'; // sempre no "chão"
    _charCanvas.width=CHAR.size; _charCanvas.height=CHAR.size;

    // Desenha frame
    const ctx=_charCtx;
    ctx.clearRect(0,0,CHAR.size,CHAR.size);
    const img=_imgs[CHAR.mode];
    if(!img||!_spriteLoaded[CHAR.mode]){ requestAnimationFrame(loop); return; }
    const sp2=SPRITES[CHAR.mode];
    const fw=img.naturalWidth/sp2.cols, fh=img.naturalHeight/sp2.rows;
    const col=CHAR.frame%sp2.cols, row=Math.floor(CHAR.frame/sp2.cols);
    ctx.save();
    if(CHAR.dir===-1){
      // Espelha horizontalmente
      ctx.translate(CHAR.size,0); ctx.scale(-1,1);
    }
    ctx.drawImage(img, col*fw, row*fh, fw, fh, 0, 0, CHAR.size, CHAR.size);
    ctx.restore();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function setCharMode(mode, durationMs){
  CHAR.mode=mode; CHAR.frame=0; CHAR.frameTimer=0;
  if(mode==='walk'){
    // Velocidade aleatória leve
    const speed=1.2+Math.random()*1.5;
    CHAR.vx=CHAR.dir*speed;
  }
  if(durationMs){
    setTimeout(()=>{ CHAR.mode='walk'; CHAR.vx=CHAR.dir*(1.2+Math.random()*1.5); },durationMs);
  }
}

// Inicia andando
function initChar(){
  const stW=document.getElementById('stage').offsetWidth;
  CHAR.x=stW*0.4; CHAR.vx=1.5; CHAR.dir=1;
  CHAR.mode='walk';
}

// Muda direção periodicamente + idle espontâneo
function charAI(){
  setInterval(()=>{
    if(CHAR.mode==='walk'&&Math.random()<0.08){
      // 8% chance de parar e fazer idle
      setCharMode(Math.random()<0.5?'idle1':'idle2', 2800+Math.random()*1500);
    }
    if(CHAR.mode==='walk'&&Math.random()<0.05){
      CHAR.vx=-CHAR.vx; CHAR.dir=CHAR.vx>0?1:-1;
    }
  },800);
}

// Triggers de fora
function triggerApgar(){
  // Cobre tela com canvas separado (mantém canvas do sprite também)
  const ov=document.getElementById('apgar-ov');
  const canvas=document.getElementById('apgar-canvas');
  ov.style.display='block'; ov.classList.add('visible');
  const ctx2=canvas.getContext('2d');
  const sp=SPRITES['idle1'];
  const img=_imgs['idle1'];
  if(!img||!_spriteLoaded['idle1']){ ov.style.display='none'; return; }
  canvas.width=canvas.offsetWidth||window.innerWidth;
  canvas.height=canvas.offsetHeight||window.innerHeight;
  const sz=Math.max(canvas.width,canvas.height)/2;
  let f=0, loop=0;
  const iv=setInterval(()=>{
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    const fw=img.naturalWidth/sp.cols, fh=img.naturalHeight/sp.rows;
    const col=f%sp.cols, row=Math.floor(f/sp.cols);
    ctx2.drawImage(img,col*fw,row*fh,fw,fh,(canvas.width-sz)/2,(canvas.height-sz)/2,sz,sz);
    f++; if(f>=sp.total){f=0;loop++; if(loop>=3){clearInterval(iv);
      ov.classList.add('slo');
      setTimeout(()=>{ov.style.display='none';ov.classList.remove('slo','visible');},580);
    }}
  },Math.round(1000/sp.fps));
  // Personagem faz idle1 também
  setCharMode('idle1', sp.total/sp.fps*3*1000+200);
}

function triggerFugazi(){

  let f=0,loop=0,_hide=null;
  const iv=setInterval(()=>{
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    const fw=img.naturalWidth/sp.cols,fh=img.naturalHeight/sp.rows;
    const col=f%sp.cols,row=Math.floor(f/sp.cols);
    ctx2.drawImage(img,col*fw,row*fh,fw,fh,(canvas.width-sz)/2,(canvas.height-sz)/2,sz,sz);
    f++; if(f>=sp.total){f=0;loop++;if(loop>=3){clearInterval(iv);
      _hide=setTimeout(()=>{
        w.classList.remove('fi'); w.classList.add('fo');
        setTimeout(()=>{w.classList.remove('fo');w.style.visibility='hidden';},420);

  setCharMode('idle2', sp.total/sp.fps*3*1000+3200);

function loadPos(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch{return[]}}
function savePos(a){localStorage.setItem(LS,JSON.stringify(a))}
function diasCorridos(ds){return Math.floor((new Date()-new Date(ds+'T00:00:00'))/86400000)}
function statusPos(p,pa){
  const pnl=(pa/p.entrada-1)*100, d=diasCorridos(p.data);
  if(p.fechada) return p.motivo_fechamento||'fechada';
  if(pnl>=TP*100) return 'tp';
  if(d>=7) return 'time_stop';
  return 'open';
}
function autoVCP(dados){
  if(!dados?.apgar?.acoes) return;
  const hoje=new Date().toISOString().split('T')[0];
  const pos=loadPos(), ex=new Set(pos.filter(p=>p.data===hoje).map(p=>p.ticker));
  dados.apgar.acoes.forEach(a=>{
    if(a.score>=5&&a.score<=8&&a.scores?.breakout===2&&a.mrs>0&&a.rsv>0&&!ex.has(a.ticker)){
      pos.push({id:Date.now()+'_'+a.ticker,ticker:a.ticker,entrada:a.preco,score:a.score,
        data:hoje,notas:'VCP auto',fechada:false,_preco_atual:a.preco});
      ex.add(a.ticker);
    }
  });
  savePos(pos);
}
function atualizaPrecos(dados){
  if(!dados) return;
  const pos=loadPos(); let upd=false;
  pos.forEach(p=>{
    if(p.fechada) return;
    const a=(dados.apgar?.acoes||[]).find(x=>x.ticker===p.ticker);
    if(a&&a.preco!==p._preco_atual){p._preco_atual=a.preco;upd=true;}
  });
  if(upd) savePos(pos);
}

function initAudio(){if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(t){
  if(!_soundOn||!_ctx) return;
  const now=_ctx.currentTime;
  if(t==='swoosh'){
    const o=_ctx.createOscillator(),g=_ctx.createGain();o.connect(g);g.connect(_ctx.destination);
    o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(200,now+.2);
    g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.25);
    o.start(now);o.stop(now+.25);
  } else if(t==='chime'){
    [523,659,784].forEach((f,i)=>{
      const o=_ctx.createOscillator(),g=_ctx.createGain();o.type='sine';o.connect(g);g.connect(_ctx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0,now+i*.08);g.gain.linearRampToValueAtTime(.06,now+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.45);
      o.start(now+i*.08);o.stop(now+i*.08+.45);
    });
  } else if(t==='tick'){
    const o=_ctx.createOscillator(),g=_ctx.createGain();o.type='square';o.connect(g);g.connect(_ctx.destination);
    o.frequency.value=1000;g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.001,now+.04);
    o.start(now);o.stop(now+.04);
  } else if(t==='ambient'){
    for(let i=0;i<3;i++){
      const dl=Math.random()*.6;
      const o=_ctx.createOscillator(),g=_ctx.createGain();o.type='square';o.connect(g);g.connect(_ctx.destination);
      o.frequency.value=600+Math.random()*400;
      g.gain.setValueAtTime(.015,now+dl);g.gain.exponentialRampToValueAtTime(.001,now+dl+.025);
      o.start(now+dl);o.stop(now+dl+.025);
    }
  }
}
function toggleSound(){
  initAudio(); _soundOn=!_soundOn;
  const b=document.getElementById('snd-btn');
  b.textContent=_soundOn?'♪ SOM ON':'♪ SOM';
  b.classList.toggle('snd-on',_soundOn);
  if(_soundOn) setInterval(()=>{if(_soundOn) playSound('ambient');},2800+Math.random()*1500);
}

async function atualizarDados(t=1,m=3){
  lprog(30+t*20,'CONECTANDO...');
  try{
    const r=await fetch('/api/screener',{cache:'default'});
    if(r.status===404) throw new Error('API 404');
    if(!r.ok) throw new Error('Erro '+r.status);
    const d=await r.json();
    if(d.error&&d.retry){
      document.getElementById('updateTime').innerHTML='<span style="color:orange">⏳'+d.error+'</span>';
      if(t<m) setTimeout(()=>atualizarDados(t+1,m),10000);
      return;
    }
    onLoad(d);
  }catch(e){
    console.error(e);
    document.getElementById('updateTime').innerHTML='⚠ DEMO';
    onLoad(DEMO);
  }
}

function onLoad(d){
  _dados=d;
  lprog(100,'SISTEMAS ONLINE');
  document.getElementById('updateTime').textContent=d._demo?'⚠ DEMO':(d.lastUpdate||'—');
  if(!d._demo){ autoVCP(d); atualizaPrecos(d); }
  updateRooms(d);
  updateTrackerRoom();
  if(document.getElementById('panel').classList.contains('open')) renderPanel(_room);
  playSound('ambient');
  setTimeout(hideLoad,500);
}

async function forceUpdate(ev){
  const b=ev.currentTarget; b.disabled=true; b.textContent='⏳';
  triggerFugazi(); playSound('swoosh');
  try{
    const r=await fetch('/api/screener?force='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error();
    onLoad(await r.json()); b.textContent='✅';
  }catch(e){b.textContent='❌';}
  finally{setTimeout(()=>{b.textContent='↻ UPDATE';b.disabled=false;},2000);}
}

document.addEventListener('DOMContentLoaded',()=>{
  lprog(10,'INICIALIZANDO...');
  setTimeout(()=>lprog(40,'CARREGANDO SPRITES...'),200);
  // Adiciona listeners nas salas para abrir panel
  ['mrs','apgar','tracker'].forEach(r=>{
    document.getElementById('room-'+r).addEventListener('click',()=>openPanel(r));
  });
  initChar();
  charAI();
  atualizarDados();
});
</script>
